INPUT:
  DATASET: PRW
  DATA_ROOT: /scratch.hpc/carmine.santella/data/PRW
  MIN_SIZE: 900
  MAX_SIZE: 1500
  BATCH_SIZE_TRAIN: 3
  BATCH_SIZE_TEST: 1
  NUM_WORKERS_TRAIN: 6
  NUM_WORKERS_TEST: 6
SOLVER:
  MAX_EPOCHS: 18
  BASE_LR: 0.0003
  HEAD_LR_MULT: 10.0
  WARMUP_FACTOR: 0.001
  LR_DECAY_MILESTONES:
  - 16
  GAMMA: 0.1
  WEIGHT_DECAY: 0.0005
  SGD_MOMENTUM: 0.9
  LW_RPN_REG: 1.0
  LW_RPN_CLS: 1.0
  LW_PROPOSAL_REG: 10.0
  LW_PROPOSAL_CLS: 1.0
  LW_BOX_REG: 1.0
  LW_BOX_CLS: 1.0
  LW_BOX_REID: 1.0
  CLIP_GRADIENTS: 10.0
MODEL:
  BACKBONE:
    NAME: swin_small
    PRETRAINED: true
    FROZEN_BN: false
    SEMANTIC_WEIGHT: 0.6
    WEIGHTS: ${WEIGHTS_DIR}/solider_swin_small.pth
  RPN:
    NMS_THRESH: 0.7
    BATCH_SIZE_TRAIN: 256
    POS_FRAC_TRAIN: 0.5
    POS_THRESH_TRAIN: 0.7
    NEG_THRESH_TRAIN: 0.3
    PRE_NMS_TOPN_TRAIN: 12000
    PRE_NMS_TOPN_TEST: 6000
    POST_NMS_TOPN_TRAIN: 2000
    POST_NMS_TOPN_TEST: 300
  ROI_HEAD:
    BN_NECK: true
    BATCH_SIZE_TRAIN: 128
    POS_FRAC_TRAIN: 0.5
    POS_THRESH_TRAIN: 0.5
    NEG_THRESH_TRAIN: 0.5
    SCORE_THRESH_TEST: 0.5
    NMS_THRESH_TEST: 0.4
    NMS_THRESH_TEST_2: 0.5
    DETECTIONS_PER_IMAGE_TEST: 300
  LOSS:
    LUT_SIZE: 482
    CQ_SIZE: 500
    OIM_MOMENTUM: 0.5
    OIM_SCALAR: 30.0
AMP: 'off'
EVAL_PERIOD: 0
EVAL_DET_THRESHOLDS:
- 0.5
- 0.6
- 0.7
- 0.8
EVAL_FLIP_TTA: false
CKPT_PERIOD: 1
CKPT_KEEP: 2
DISP_PERIOD: 10
TF_BOARD: true
CUDNN_BENCHMARK: false
DEVICE: cuda
SEED: 1
OUTPUT_DIR: /scratch.hpc/carmine.santella/ML4CV_ProjectWork/exp_prw_solider_swin_s_head10x
